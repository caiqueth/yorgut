# Security headers for the app's pages and assets, included by the locations in
# nginx.conf (a location that sets any add_header of its own stops inheriting
# the server's, so each one includes this file).
#
# The login token lives in localStorage, so injected scripts are the main risk:
# the policy only runs our own scripts, plus Google's sign-in script, iframe and
# stylesheet (https://developers.google.com/identity/gsi/web/guides/get-google-api-clientid#content_security_policy).
#   style-src 'unsafe-inline': MUI (emotion) adds its styles at runtime.
#   img-src: our pictures (/media), local previews (blob:), MUI's data: URIs
#     and Google profile pictures of users created before they were copied.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# Browsers must not guess content types (e.g. run an upload as a script).
add_header X-Content-Type-Options "nosniff" always;
# Other sites only learn our origin, never the page (profile ids) a link was on.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No camera, microphone or location: the app never asks for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# One origin for everything: the SPA, the API (/api, /swagger) and the
# pictures (/media, from the S3 bucket). Service names are the ones in the
# root docker-compose.yml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploaded pictures are at most 5 MB; leave room for the multipart overhead.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        proxy_pass http://api:8080;
    }

    # /media/<key> -> the "yorgut" bucket. Read-only from outside.
    location /media/ {
        limit_except GET HEAD {
            deny all;
        }
        # Pictures are only ever images: never let a browser treat one as a page or script.
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://storage:8333/yorgut/;
        # Storage details clients don't need.
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Seaweed-X-Amz-ETag;
        proxy_hide_header Seaweed-X-Amz-Owner;
    }

    # Built assets have content hashes in their names.
    location /static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes all get the app; index.html must never be cached, so
    # a deploy is picked up on the next load.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

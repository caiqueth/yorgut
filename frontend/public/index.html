<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The "y" of the logo, drawn from the font itself (Quicksand, weight
         700) on the page's blue. The PNGs are the same picture, for browsers
         without SVG icons and for home screens. -->
    <link rel="icon" href="<%= assetPrefix %>/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="<%= assetPrefix %>/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="<%= assetPrefix %>/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Yorgut: old school social media" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="<%= assetPrefix %>/manifest.json" />
    <title>Yorgut</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

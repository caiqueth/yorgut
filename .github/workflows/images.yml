# Builds the production images on every push to main and pushes them to the
# GitHub container registry, so the server only pulls them (README.md, "Deploying"):
# building on a 1 GB machine takes forever or runs out of memory.
#
#   ghcr.io/<owner>/yorgut-api:latest   and :<commit sha>
#   ghcr.io/<owner>/yorgut-web:latest   and :<commit sha>
#
# Both are built for amd64 and arm64 (Oracle's Ampere machines). The Go binary
# and the SPA are cross-built on the runner's own architecture, so arm64 costs
# almost nothing extra.
name: images

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
            # The repository variable GOOGLE_CLIENT_ID (Settings > Secrets and
            # variables > Actions > Variables), baked into the SPA.
            build-args: GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yorgut-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/yorgut-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

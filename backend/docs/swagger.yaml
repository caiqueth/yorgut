basePath: /api/v1
definitions:
  transport.AmIFriendOfResponse:
    properties:
      amIFriend:
        type: boolean
      friendshipId:
        type: integer
        x-nullable: true
      isPendingMyReply:
        type: boolean
      isPendingTheirReply:
        type: boolean
    required:
    - amIFriend
    - friendshipId
    - isPendingMyReply
    - isPendingTheirReply
    type: object
  transport.AmIMemberOfResponse:
    properties:
      amIMember:
        type: boolean
      pending:
        description: |-
          Pending is true when the logged user asked to join a private community
          and the owner hasn't answered yet.
        type: boolean
    required:
    - amIMember
    - pending
    type: object
  transport.BirthdayItem:
    properties:
      birthDate:
        type: string
      daysUntil:
        type: integer
      firstName:
        type: string
      id:
        type: integer
      nextBirthday:
        description: NextBirthday is the date of the coming birthday (today counts).
        type: string
      profilePicture:
        type: string
        x-nullable: true
    required:
    - birthDate
    - daysUntil
    - firstName
    - id
    - nextBirthday
    - profilePicture
    type: object
  transport.CommunityCategory:
    enum:
    - activities
    - alumni_schools
    - arts_entertainment
    - automotive
    - business
    - cities_neighborhoods
    - companies
    - computers_internet
    - countries_regional
    - cultures_community
    - family_home
    - fashion_beauty
    - food_drink_wine
    - gay_lesbian_bi
    - games
    - government_politics
    - health_wellness_fitness
    - hobbies_crafts
    - individuals
    - music
    - other
    - pets_animals
    - recreation_sports
    - religion_beliefs
    - romance_relationships
    - schools_education
    - science_history
    - travel
    type: string
    x-enum-varnames:
    - CategoryActivities
    - CategoryAlumniSchools
    - CategoryArtsEntertainment
    - CategoryAutomotive
    - CategoryBusiness
    - CategoryCitiesNeighborhoods
    - CategoryCompanies
    - CategoryComputersInternet
    - CategoryCountriesRegional
    - CategoryCulturesCommunity
    - CategoryFamilyHome
    - CategoryFashionBeauty
    - CategoryFoodDrinkWine
    - CategoryGayLesbianBi
    - CategoryGames
    - CategoryGovernmentPolitics
    - CategoryHealthWellnessFitness
    - CategoryHobbiesCrafts
    - CategoryIndividuals
    - CategoryMusic
    - CategoryOther
    - CategoryPetsAnimals
    - CategoryRecreationSports
    - CategoryReligionBeliefs
    - CategoryRomanceRelationships
    - CategorySchoolsEducation
    - CategoryScienceHistory
    - CategoryTravel
  transport.CommunityInvitationItem:
    properties:
      communityId:
        type: integer
      communityName:
        type: string
      communityPicture:
        type: string
        x-nullable: true
      communityPrivate:
        type: boolean
      createdAt:
        type: string
      id:
        type: integer
      inviterFirstName:
        type: string
      inviterId:
        type: integer
      inviterProfilePicture:
        type: string
        x-nullable: true
    required:
    - communityId
    - communityName
    - communityPicture
    - communityPrivate
    - createdAt
    - id
    - inviterFirstName
    - inviterId
    - inviterProfilePicture
    type: object
  transport.CommunityItem:
    properties:
      createdBy:
        type: integer
      id:
        type: integer
      membershipCount:
        type: integer
      name:
        type: string
      owner:
        type: integer
      profilePicture:
        type: string
        x-nullable: true
    required:
    - createdBy
    - id
    - membershipCount
    - name
    - owner
    - profilePicture
    type: object
  transport.CommunityMemberEntry:
    properties:
      firstName:
        type: string
      friendCount:
        type: integer
      id:
        type: integer
      profilePicture:
        type: string
        x-nullable: true
    required:
    - firstName
    - friendCount
    - id
    - profilePicture
    type: object
  transport.CommunitySearchItem:
    properties:
      category:
        $ref: '#/definitions/transport.CommunityCategory'
      id:
        type: integer
      memberCount:
        type: integer
      name:
        type: string
      pending:
        description: Pending is true when the logged user already asked to join.
        type: boolean
      private:
        type: boolean
      profilePicture:
        type: string
        x-nullable: true
    required:
    - category
    - id
    - memberCount
    - name
    - pending
    - private
    - profilePicture
    type: object
  transport.CreateCommunityResponse:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  transport.CreateFriendshipRequest:
    properties:
      userRequesteeId:
        type: integer
    required:
    - userRequesteeId
    type: object
  transport.CreatePollRequest:
    properties:
      closesAt:
        description: |-
          ClosesAt is when voting ends; omitted, the poll stays open until its
          author or the community's owner closes it.
        type: string
      description:
        maxLength: 2048
        type: string
      options:
        items:
          type: string
        maxItems: 10
        minItems: 2
        type: array
      question:
        maxLength: 200
        type: string
    required:
    - options
    - question
    type: object
  transport.CreatePollResponse:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  transport.CreateScrapRequest:
    properties:
      content:
        maxLength: 2048
        type: string
      userRecipientId:
        type: integer
    required:
    - content
    - userRecipientId
    type: object
  transport.CreateTestimonialRequest:
    properties:
      content:
        maxLength: 2048
        type: string
      userRecipientId:
        type: integer
    required:
    - content
    - userRecipientId
    type: object
  transport.CreateTopicRequest:
    properties:
      communityId:
        type: integer
      text:
        maxLength: 2048
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - communityId
    - text
    - title
    type: object
  transport.ErrorResponse:
    properties:
      error:
        type: string
    required:
    - error
    type: object
  transport.FanItem:
    properties:
      firstName:
        type: string
      friendCount:
        type: integer
      id:
        type: integer
      profilePicture:
        type: string
        x-nullable: true
    required:
    - firstName
    - friendCount
    - id
    - profilePicture
    type: object
  transport.FindCommunityByIdResponse:
    properties:
      category:
        $ref: '#/definitions/transport.CommunityCategory'
      createdAt:
        type: string
      createdById:
        type: integer
      name:
        type: string
      ownerFirstName:
        type: string
      ownerId:
        type: integer
      private:
        type: boolean
    required:
    - category
    - createdAt
    - createdById
    - name
    - ownerFirstName
    - ownerId
    - private
    type: object
  transport.FindCommunityMembersResponse:
    properties:
      count:
        type: integer
      members:
        items:
          $ref: '#/definitions/transport.CommunityMemberEntry'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
    required:
    - count
    - members
    - page
    - pageSize
    type: object
  transport.FindCommunityProfileByIdResponse:
    properties:
      description:
        type: string
        x-nullable: true
      profilePicture:
        type: string
        x-nullable: true
    required:
    - description
    - profilePicture
    type: object
  transport.FindFriendsOfUserResponse:
    properties:
      count:
        type: integer
      friends:
        items:
          $ref: '#/definitions/transport.FriendItem'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
    required:
    - count
    - friends
    - page
    - pageSize
    type: object
  transport.FindInvitableFriendsResponse:
    properties:
      count:
        type: integer
      friends:
        items:
          $ref: '#/definitions/transport.InvitableFriendItem'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
    required:
    - count
    - friends
    - page
    - pageSize
    type: object
  transport.FindJoinRequestsResponse:
    properties:
      requests:
        items:
          $ref: '#/definitions/transport.JoinRequestItem'
        type: array
    required:
    - requests
    type: object
  transport.FindManyCommunitiesResponse:
    properties:
      communities:
        items:
          $ref: '#/definitions/transport.CommunityItem'
        type: array
    required:
    - communities
    type: object
  transport.FindMeResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      friendCount:
        type: integer
      id:
        type: integer
      lastName:
        type: string
      privacy:
        $ref: '#/definitions/transport.PrivacySettings'
      theme:
        description: Theme is the look the user picked for the app.
        enum:
        - "2005"
        - "2008"
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - email
    - firstName
    - friendCount
    - id
    - lastName
    - privacy
    - theme
    - updatedAt
    type: object
  transport.FindMyCommunityInvitationsResponse:
    properties:
      invitations:
        items:
          $ref: '#/definitions/transport.CommunityInvitationItem'
        type: array
    required:
    - invitations
    type: object
  transport.FindMyFriendsResponse:
    properties:
      count:
        type: integer
      friends:
        items:
          $ref: '#/definitions/transport.MyFriendItem'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
    required:
    - count
    - friends
    - page
    - pageSize
    type: object
  transport.FindMyOwnedCommunitiesResponse:
    properties:
      communities:
        items:
          $ref: '#/definitions/transport.MyOwnedCommunityItem'
        type: array
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
    required:
    - communities
    - count
    - page
    - pageSize
    type: object
  transport.FindPendingFriendshipOfUserResponse:
    properties:
      count:
        type: integer
      pendingFriendships:
        items:
          $ref: '#/definitions/transport.PendingFriendship'
        type: array
    required:
    - count
    - pendingFriendships
    type: object
  transport.FindPhotosOfUserResponse:
    properties:
      canUpload:
        description: CanUpload is true when the logged user owns the album.
        type: boolean
      count:
        type: integer
      maxPhotos:
        description: MaxPhotos is how many photos the personal album can hold.
        type: integer
      photos:
        items:
          $ref: '#/definitions/transport.PhotoItem'
        type: array
    required:
    - canUpload
    - count
    - maxPhotos
    - photos
    type: object
  transport.FindScrapOfUserRecipientResponse:
    properties:
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      scraps:
        items:
          $ref: '#/definitions/transport.ScrapItem'
        type: array
    required:
    - count
    - page
    - pageSize
    - scraps
    type: object
  transport.FindTestimonialsOfUserResponse:
    properties:
      canWrite:
        type: boolean
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      pending:
        description: Pending is only filled when the recipient is the one looking.
        items:
          $ref: '#/definitions/transport.TestimonialItem'
        type: array
      testimonials:
        description: Testimonials holds the approved testimonials, visible to everyone.
        items:
          $ref: '#/definitions/transport.TestimonialItem'
        type: array
    required:
    - canWrite
    - count
    - page
    - pageSize
    - pending
    - testimonials
    type: object
  transport.FindUpcomingBirthdaysResponse:
    properties:
      birthdays:
        items:
          $ref: '#/definitions/transport.BirthdayItem'
        type: array
    required:
    - birthdays
    type: object
  transport.FindUserFanListResponse:
    properties:
      count:
        type: integer
      fans:
        items:
          $ref: '#/definitions/transport.FanItem'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
    required:
    - count
    - fans
    - page
    - pageSize
    type: object
  transport.FindUserMembershipsResponse:
    properties:
      communities:
        items:
          $ref: '#/definitions/transport.CommunityItem'
        type: array
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
    required:
    - communities
    - count
    - page
    - pageSize
    type: object
  transport.FindUserResponse:
    properties:
      createdAt:
        type: string
      firstName:
        type: string
      friendCount:
        type: integer
      id:
        type: integer
      lastName:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - firstName
    - friendCount
    - id
    - lastName
    - updatedAt
    type: object
  transport.FindUserWithProfileByIdResponse:
    properties:
      about:
        type: string
        x-nullable: true
      birthCity:
        type: string
        x-nullable: true
      birthDate:
        description: |-
          BirthDate is a calendar date; null when the viewer may not see it or
          the user never set it.
        type: string
        x-nullable: true
      books:
        type: string
        x-nullable: true
      createdAt:
        type: string
      cuisine:
        type: string
        x-nullable: true
      description:
        type: string
        x-nullable: true
      fashion:
        type: string
        x-nullable: true
      firstName:
        type: string
      friendCount:
        type: integer
      hiddenFields:
        description: |-
          HiddenFields are the profile fields left out for this viewer (by their
          JSON names, "birthDate" included), so the page leaves their rows out
          instead of showing "-".
        items:
          type: string
        type: array
      hobbies:
        type: string
        x-nullable: true
      humor:
        type: string
        x-nullable: true
      id:
        type: integer
      interests:
        type: string
        x-nullable: true
      lastName:
        type: string
      livesWith:
        type: string
        x-nullable: true
      movies:
        type: string
        x-nullable: true
      music:
        type: string
        x-nullable: true
      passions:
        type: string
        x-nullable: true
      profilePicture:
        type: string
        x-nullable: true
      relationshipStatus:
        type: string
        x-nullable: true
      religion:
        type: string
        x-nullable: true
      sports:
        type: string
        x-nullable: true
      updatedAt:
        type: string
      visibility:
        allOf:
        - $ref: '#/definitions/transport.ProfileVisibility'
        description: Visibility tells which parts of the profile the viewer may see.
      website:
        type: string
        x-nullable: true
    required:
    - about
    - birthCity
    - birthDate
    - books
    - createdAt
    - cuisine
    - description
    - fashion
    - firstName
    - friendCount
    - hiddenFields
    - hobbies
    - humor
    - id
    - interests
    - lastName
    - livesWith
    - movies
    - music
    - passions
    - profilePicture
    - relationshipStatus
    - religion
    - sports
    - updatedAt
    - visibility
    - website
    type: object
  transport.FriendItem:
    properties:
      firstName:
        type: string
      friendCount:
        type: integer
      id:
        type: integer
      profilePicture:
        type: string
        x-nullable: true
    required:
    - firstName
    - friendCount
    - id
    - profilePicture
    type: object
  transport.InstanceInfoResponse:
    properties:
      adminEmail:
        description: |-
          AdminEmail is how to reach the administrator (ADMIN_EMAIL), null when
          it isn't set.
        type: string
        x-nullable: true
    required:
    - adminEmail
    type: object
  transport.InvitableFriendItem:
    properties:
      firstName:
        type: string
      friendCount:
        type: integer
      id:
        type: integer
      invited:
        type: boolean
      member:
        description: 'Member: already in the community. Invited: someone already invited
          them.'
        type: boolean
      profilePicture:
        type: string
        x-nullable: true
    required:
    - firstName
    - friendCount
    - id
    - invited
    - member
    - profilePicture
    type: object
  transport.InviteToCommunityRequest:
    properties:
      userId:
        description: UserID is the friend being invited.
        type: integer
    required:
    - userId
    type: object
  transport.JoinCommunityResponse:
    properties:
      pending:
        type: boolean
    required:
    - pending
    type: object
  transport.JoinRequestItem:
    properties:
      createdAt:
        type: string
      firstName:
        type: string
      friendCount:
        type: integer
      lastName:
        type: string
      profilePicture:
        type: string
        x-nullable: true
      userId:
        type: integer
    required:
    - createdAt
    - firstName
    - friendCount
    - lastName
    - profilePicture
    - userId
    type: object
  transport.LoginResponse:
    properties:
      token:
        description: 'Token is the Yorgut session token, sent back as "Authorization:
          Bearer <token>".'
        type: string
    required:
    - token
    type: object
  transport.LoginWithGoogleRequest:
    properties:
      credential:
        description: Credential is the Google ID token returned by Sign in with Google.
        type: string
    required:
    - credential
    type: object
  transport.MyFriendItem:
    properties:
      amIFan:
        type: boolean
      firstName:
        type: string
      friendCount:
        type: integer
      id:
        type: integer
      myReview:
        $ref: '#/definitions/transport.UserReviewItem'
      profilePicture:
        type: string
        x-nullable: true
    required:
    - amIFan
    - firstName
    - friendCount
    - id
    - myReview
    - profilePicture
    type: object
  transport.MyOwnedCommunityItem:
    properties:
      id:
        type: integer
      membershipCount:
        type: integer
      name:
        type: string
      profilePicture:
        type: string
        x-nullable: true
    required:
    - id
    - membershipCount
    - name
    - profilePicture
    type: object
  transport.PendingFriendship:
    properties:
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      profilePicture:
        type: string
        x-nullable: true
      userRequestedId:
        type: integer
    required:
    - firstName
    - id
    - lastName
    - profilePicture
    - userRequestedId
    type: object
  transport.PhotoItem:
    properties:
      caption:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      url:
        type: string
    required:
    - caption
    - createdAt
    - id
    - url
    type: object
  transport.PollOptionItem:
    properties:
      id:
        type: integer
      text:
        type: string
      votes:
        description: |-
          Votes is null until the logged user voted or the poll closed, so
          results don't sway the vote.
        type: integer
        x-nullable: true
    required:
    - id
    - text
    - votes
    type: object
  transport.PollResponse:
    properties:
      authorFirstName:
        type: string
      authorId:
        type: integer
      authorProfilePicture:
        type: string
        x-nullable: true
      canClose:
        description: 'CanClose: the author or the community''s owner, while the poll
          is open.'
        type: boolean
      canVote:
        description: 'CanVote: a member who hasn''t voted, in an open poll.'
        type: boolean
      closed:
        type: boolean
      closesAt:
        type: string
        x-nullable: true
      communityId:
        type: integer
      createdAt:
        type: string
      description:
        type: string
        x-nullable: true
      id:
        type: integer
      myOptionId:
        description: MyOptionID is the logged user's vote, null when they haven't
          voted.
        type: integer
        x-nullable: true
      options:
        items:
          $ref: '#/definitions/transport.PollOptionItem'
        type: array
      question:
        type: string
      voteCount:
        type: integer
    required:
    - authorFirstName
    - authorId
    - authorProfilePicture
    - canClose
    - canVote
    - closed
    - closesAt
    - communityId
    - createdAt
    - description
    - id
    - myOptionId
    - options
    - question
    - voteCount
    type: object
  transport.PollSummary:
    properties:
      authorFirstName:
        type: string
      authorId:
        type: integer
      closed:
        type: boolean
      closesAt:
        type: string
        x-nullable: true
      createdAt:
        type: string
      id:
        type: integer
      question:
        type: string
      voteCount:
        type: integer
      voted:
        description: 'Voted: the logged user voted in it.'
        type: boolean
    required:
    - authorFirstName
    - authorId
    - closed
    - closesAt
    - createdAt
    - id
    - question
    - voteCount
    - voted
    type: object
  transport.PollsResponse:
    properties:
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      polls:
        items:
          $ref: '#/definitions/transport.PollSummary'
        type: array
    required:
    - count
    - page
    - pageSize
    - polls
    type: object
  transport.PrivacySettings:
    properties:
      hiddenProfileFields:
        description: HiddenProfileFields are keys of ProfileFieldKeys.
        items:
          type: string
        type: array
      publicAlbum:
        type: boolean
      publicBirthday:
        type: boolean
      publicCommunities:
        type: boolean
      publicScraps:
        type: boolean
      publicTestimonials:
        type: boolean
      recordVisits:
        type: boolean
    required:
    - hiddenProfileFields
    - publicAlbum
    - publicBirthday
    - publicCommunities
    - publicScraps
    - publicTestimonials
    - recordVisits
    type: object
  transport.ProfileViews:
    properties:
      allTime:
        type: integer
      lastSevenDays:
        description: LastSevenDays includes today.
        type: integer
    required:
    - allTime
    - lastSevenDays
    type: object
  transport.ProfileVisibility:
    properties:
      album:
        type: boolean
      communities:
        type: boolean
      scraps:
        type: boolean
      testimonials:
        type: boolean
    required:
    - album
    - communities
    - scraps
    - testimonials
    type: object
  transport.RecentVisitor:
    properties:
      firstName:
        type: string
      userId:
        type: integer
    required:
    - firstName
    - userId
    type: object
  transport.ReplyFriendshipRequest:
    properties:
      accept:
        description: Accept false (or missing) declines the request.
        type: boolean
      friendshipId:
        type: integer
    required:
    - accept
    - friendshipId
    type: object
  transport.ReplyJoinRequestRequest:
    properties:
      accept:
        description: Accept false (or missing) declines the request.
        type: boolean
    required:
    - accept
    type: object
  transport.ReplyTopicRequest:
    properties:
      text:
        maxLength: 2048
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - text
    - title
    type: object
  transport.Response:
    properties:
      data: {}
    required:
    - data
    type: object
  transport.ScrapItem:
    properties:
      authorId:
        type: integer
      authorName:
        type: string
      authorProfilePicture:
        type: string
        x-nullable: true
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
    required:
    - authorId
    - authorName
    - authorProfilePicture
    - content
    - createdAt
    - id
    type: object
  transport.SearchCommunitiesResponse:
    properties:
      communities:
        items:
          $ref: '#/definitions/transport.CommunitySearchItem'
        type: array
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
    required:
    - communities
    - count
    - page
    - pageSize
    type: object
  transport.SearchUsersResponse:
    properties:
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      users:
        items:
          $ref: '#/definitions/transport.UserSearchItem'
        type: array
    required:
    - count
    - page
    - pageSize
    - users
    type: object
  transport.TestimonialItem:
    properties:
      approved:
        type: boolean
      authorId:
        type: integer
      authorName:
        type: string
      authorProfilePicture:
        type: string
        x-nullable: true
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
    required:
    - approved
    - authorId
    - authorName
    - authorProfilePicture
    - content
    - createdAt
    - id
    type: object
  transport.Topic:
    properties:
      authorFirstName:
        type: string
      authorId:
        type: integer
      authorProfilePicture:
        type: string
        x-nullable: true
      createdAt:
        type: string
      id:
        type: integer
      replies:
        type: integer
      text:
        type: string
      title:
        type: string
    required:
    - authorFirstName
    - authorId
    - authorProfilePicture
    - createdAt
    - id
    - replies
    - text
    - title
    type: object
  transport.TopicRepliesResponse:
    properties:
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      replies:
        items:
          $ref: '#/definitions/transport.TopicReply'
        type: array
      topic:
        allOf:
        - $ref: '#/definitions/transport.Topic'
        x-nullable: true
    required:
    - count
    - page
    - pageSize
    - replies
    - topic
    type: object
  transport.TopicReply:
    properties:
      authorFirstName:
        type: string
      authorId:
        type: integer
      authorProfilePicture:
        type: string
        x-nullable: true
      createdAt:
        type: string
      id:
        type: integer
      text:
        type: string
      title:
        type: string
    required:
    - authorFirstName
    - authorId
    - authorProfilePicture
    - createdAt
    - id
    - text
    - title
    type: object
  transport.TopicSummary:
    properties:
      authorId:
        type: integer
      authorProfilePicture:
        type: string
        x-nullable: true
      id:
        type: integer
      lastReplyDate:
        type: string
      lastReplyPreview:
        type: string
      replies:
        type: integer
      title:
        type: string
    required:
    - authorId
    - authorProfilePicture
    - id
    - lastReplyDate
    - lastReplyPreview
    - replies
    - title
    type: object
  transport.TopicsResponse:
    properties:
      count:
        type: integer
      page:
        type: integer
      pageSize:
        type: integer
      topics:
        items:
          $ref: '#/definitions/transport.TopicSummary'
        type: array
    required:
    - count
    - page
    - pageSize
    - topics
    type: object
  transport.UpdateCommunityRequest:
    properties:
      category:
        $ref: '#/definitions/transport.CommunityCategory'
      description:
        maxLength: 2048
        type: string
      name:
        maxLength: 100
        type: string
      private:
        description: Making a private community public accepts its pending join requests.
        type: boolean
    required:
    - category
    - description
    - name
    - private
    type: object
  transport.UpdateMeRequest:
    properties:
      about:
        maxLength: 2048
        type: string
      birthCity:
        maxLength: 2048
        type: string
      birthDate:
        description: BirthDate is a calendar date, "YYYY-MM-DD"; empty keeps the current
          one.
        type: string
      books:
        maxLength: 2048
        type: string
      cuisine:
        maxLength: 2048
        type: string
      description:
        maxLength: 2048
        type: string
      fashion:
        maxLength: 2048
        type: string
      firstName:
        maxLength: 50
        type: string
      hobbies:
        maxLength: 2048
        type: string
      humor:
        maxLength: 2048
        type: string
      interests:
        maxLength: 2048
        type: string
      lastName:
        maxLength: 50
        type: string
      livesWith:
        maxLength: 2048
        type: string
      movies:
        maxLength: 2048
        type: string
      music:
        maxLength: 2048
        type: string
      passions:
        maxLength: 2048
        type: string
      relationshipStatus:
        maxLength: 2048
        type: string
      religion:
        maxLength: 2048
        type: string
      sports:
        maxLength: 2048
        type: string
      website:
        maxLength: 2048
        type: string
    required:
    - about
    - birthCity
    - birthDate
    - books
    - cuisine
    - description
    - fashion
    - firstName
    - hobbies
    - humor
    - interests
    - lastName
    - livesWith
    - movies
    - music
    - passions
    - relationshipStatus
    - religion
    - sports
    - website
    type: object
  transport.UpdateMyPrivacyRequest:
    properties:
      hiddenProfileFields:
        description: Keys of the profile fields non-friends don't see; empty shows
          them all.
        items:
          type: string
        type: array
      publicAlbum:
        type: boolean
      publicBirthday:
        type: boolean
      publicCommunities:
        type: boolean
      publicScraps:
        type: boolean
      publicTestimonials:
        type: boolean
      recordVisits:
        type: boolean
    required:
    - hiddenProfileFields
    - publicAlbum
    - publicBirthday
    - publicCommunities
    - publicScraps
    - publicTestimonials
    - recordVisits
    type: object
  transport.UpdateMyThemeRequest:
    properties:
      theme:
        enum:
        - "2005"
        - "2008"
        type: string
    required:
    - theme
    type: object
  transport.UpsertUserReviewRequest:
    properties:
      cool:
        example: 3
        maximum: 3
        minimum: 0
        type: integer
      sexy:
        example: 2
        maximum: 3
        minimum: 0
        type: integer
      trustworthy:
        example: 3
        maximum: 3
        minimum: 0
        type: integer
    required:
    - cool
    - sexy
    - trustworthy
    type: object
  transport.UserFanSummaryResponse:
    properties:
      amIFan:
        type: boolean
      canFan:
        type: boolean
      fanCount:
        type: integer
    required:
    - amIFan
    - canFan
    - fanCount
    type: object
  transport.UserReviewItem:
    properties:
      cool:
        type: integer
      sexy:
        type: integer
      trustworthy:
        type: integer
    required:
    - cool
    - sexy
    - trustworthy
    type: object
  transport.UserReviewSummaryResponse:
    properties:
      canReview:
        type: boolean
      cool:
        type: number
      myReview:
        allOf:
        - $ref: '#/definitions/transport.UserReviewItem'
        x-nullable: true
      reviewCount:
        type: integer
      sexy:
        type: number
      trustworthy:
        type: number
    required:
    - canReview
    - cool
    - myReview
    - reviewCount
    - sexy
    - trustworthy
    type: object
  transport.UserSearchItem:
    properties:
      firstName:
        type: string
      friendCount:
        type: integer
      id:
        type: integer
      profilePicture:
        type: string
        x-nullable: true
    required:
    - firstName
    - friendCount
    - id
    - profilePicture
    type: object
  transport.VotePollRequest:
    properties:
      optionId:
        type: integer
    required:
    - optionId
    type: object
  transport.WelcomeResponse:
    properties:
      communityCount:
        type: integer
      directConnections:
        type: integer
      hasRatedFriends:
        description: |-
          For the "próximas etapas": whether the user rated any current friend,
          and how many communities they're in (DirectConnections is their friends).
        type: boolean
      indirectConnections:
        type: integer
      numberOfFans:
        type: integer
      numberOfScraps:
        type: integer
      profileViews:
        $ref: '#/definitions/transport.ProfileViews'
      recentVisitors:
        items:
          $ref: '#/definitions/transport.RecentVisitor'
        type: array
      recordVisits:
        description: |-
          RecordVisits false: the user turned off "registrar minhas visitas", so
          RecentVisitors is empty on purpose.
        type: boolean
      todaysLuck:
        type: string
      userCreatedAt:
        type: string
      userFirstName:
        type: string
    required:
    - communityCount
    - directConnections
    - hasRatedFriends
    - indirectConnections
    - numberOfFans
    - numberOfScraps
    - profileViews
    - recentVisitors
    - recordVisits
    - todaysLuck
    - userCreatedAt
    - userFirstName
    type: object
host: localhost:8080
info:
  contact: {}
  description: Our very own OG Social Media.
  license:
    name: Apache 2.0
  title: Yorgut APIs
  version: "1.0"
paths:
  /auth/google:
    post:
      consumes:
      - application/json
      description: 'Validates the Google ID token from Sign in with Google, creates
        the user on their first login, and returns a Yorgut session token. Send it
        as "Authorization: Bearer <token>" on every other request.'
      operationId: loginWithGoogle
      parameters:
      - description: Google credential
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transport.LoginWithGoogleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Logs in with a Google account.
      tags:
      - Auth
  /communities:
    post:
      consumes:
      - multipart/form-data
      description: Creates a community owned by the logged user, optionally with a
        picture (PNG or JPEG, max 5 MB and 50 megapixels; stored shrunk to 1024px
        and 1 MB).
      operationId: createCommunity
      parameters:
      - description: Community name
        in: formData
        name: name
        required: true
        type: string
      - description: Community category, one of transport.CommunityCategory (e.g.
          computers_internet)
        in: formData
        name: category
        required: true
        type: string
      - description: Community description (max 2048 characters)
        in: formData
        name: description
        type: string
      - description: 'Private: only members read the forum, and the owner accepts
          who joins'
        in: formData
        name: private
        type: boolean
      - description: Community picture
        in: formData
        name: picture
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/transport.Response'
            - properties:
                data:
                  $ref: '#/definitions/transport.CreateCommunityResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create Community
      tags:
      - Community
  /communities/{communityId}:
    get:
      description: Returns the community matching the requested id
      operationId: findCommunity
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FindCommunityByIdResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Single community by id.
      tags:
      - Community
    put:
      consumes:
      - application/json
      description: Replaces the community's name, category, description and privacy.
        Only the owner may (403 otherwise). Making a private community public accepts
        its pending join requests.
      operationId: updateCommunity
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: Community details
        in: body
        name: Community
        required: true
        schema:
          $ref: '#/definitions/transport.UpdateCommunityRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Updates a community.
      tags:
      - Community
  /communities/{communityId}/hot-topics:
    get:
      description: Returns a list of topics. In a private community, only members
        may read (403 otherwise).
      operationId: findCommunityHotTopics
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.TopicsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Gets the 5 newest topics of a community.
      tags:
      - Community
  /communities/{communityId}/invitable-friends:
    get:
      description: Returns a page of friends, most recently seen first, each saying
        whether they already are a member or already invited. Only members may (403
        otherwise).
      operationId: findInvitableFriends
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: Page, starting at 1 (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 50)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FindInvitableFriendsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Gets a page of the logged user's friends to invite to a community.
      tags:
      - Community
  /communities/{communityId}/invitations:
    post:
      consumes:
      - application/json
      description: Only members may invite (403 otherwise), and only their friends
        (403). 409 when the friend is already a member or already invited.
      operationId: inviteToCommunity
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: The friend to invite
        in: body
        name: Invitation
        required: true
        schema:
          $ref: '#/definitions/transport.InviteToCommunityRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Invites a friend to join a community.
      tags:
      - Community
  /communities/{communityId}/join-requests:
    get:
      description: Returns the pending join requests, oldest first. Only the owner
        may (403 otherwise).
      operationId: findCommunityJoinRequests
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FindJoinRequestsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Lists who asked to join a private community.
      tags:
      - Community
  /communities/{communityId}/join-requests/{userId}/reply:
    post:
      consumes:
      - application/json
      description: Accepting makes the user a member; declining drops the request.
        Only the owner may (403 otherwise).
      operationId: replyCommunityJoinRequest
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: ID of the user who asked to join
        in: path
        name: userId
        required: true
        type: integer
      - description: Accept or decline
        in: body
        name: Reply
        required: true
        schema:
          $ref: '#/definitions/transport.ReplyJoinRequestRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accepts or declines a request to join a private community.
      tags:
      - Community
  /communities/{communityId}/members:
    get:
      description: Returns a page of the community's members, most recently seen first
      operationId: findCommunityMembers
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: Page, starting at 1 (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 50)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FindCommunityMembersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a page of community members.
      tags:
      - Community
  /communities/{communityId}/picture:
    put:
      consumes:
      - multipart/form-data
      description: Uploads a PNG or JPEG (max 5 MB and 50 megapixels; stored shrunk
        to 1024px and 1 MB) as the community's picture. Only the owner may (403 otherwise).
      operationId: updateCommunityPicture
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: Community picture
        in: formData
        name: picture
        required: true
        type: file
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replaces a community's picture.
      tags:
      - Community
  /communities/{communityId}/polls:
    get:
      description: Returns a page of polls, newest first. In a private community,
        only members may see them (403 otherwise).
      operationId: findCommunityPolls
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: Page, starting at 1 (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 50)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.PollsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Gets a page of a community's polls.
      tags:
      - Poll
    post:
      consumes:
      - application/json
      description: Only members may (403 otherwise). Takes 2 to 10 different options;
        closesAt, when given, must be in the future.
      operationId: createPoll
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: The poll
        in: body
        name: Poll
        required: true
        schema:
          $ref: '#/definitions/transport.CreatePollRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/transport.Response'
            - properties:
                data:
                  $ref: '#/definitions/transport.CreatePollResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Creates a poll in a community.
      tags:
      - Poll
  /communities/{communityId}/profile:
    get:
      description: Returns the community profile matching the requested id
      operationId: findCommunityProfile
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FindCommunityProfileByIdResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Single community profile by its id.
      tags:
      - Community
  /communities/{communityId}/related:
    get:
      description: Returns 9 random communities other than this one, the same ones
        all day (communities don't record related ones yet)
      operationId: findRelatedCommunities
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FindManyCommunitiesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":

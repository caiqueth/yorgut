host: localhost:8080
info:
  contact: {}
  description: Our very own OG Social Media.
  license:
    name: Apache 2.0
  title: Yorgut APIs
  version: "1.0"
paths:
  /auth/google:
    post:
      consumes:
      - application/json
      description: 'Validates the Google ID token from Sign in with Google, creates
        the user on their first login, and returns a Yorgut session token. Send it
        as "Authorization: Bearer <token>" on every other request.'
      operationId: loginWithGoogle
      parameters:
      - description: Google credential
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transport.LoginWithGoogleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.LoginResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
      summary: Logs in with a Google account.
      tags:
      - Auth
  /communities:
    get:
      description: Returns an array of communities
      operationId: findCommunities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FindManyCommunitiesResponse'
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get Multiple communities.
      tags:
      - Community
    post:
      consumes:
      - multipart/form-data
      description: Creates a community owned by the logged user, optionally with a
        picture (PNG or JPEG, max 1 MB and 1024x1024).
      operationId: createCommunity
      parameters:
      - description: Community name
        in: formData
        name: name
        required: true
        type: string
      - description: Community category
        in: formData
        name: category
        required: true
        type: string
      - description: Community picture
        in: formData
        name: picture
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/transport.Response'
            - properties:
                data:
                  $ref: '#/definitions/transport.CreateCommunityResponse'
              type: object
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Create Community
      tags:
      - Community
  /communities/{communityId}:
    delete:
      description: Deletes a community
      operationId: deleteCommunity
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Delete community by id.
      tags:
      - Community
    get:
      description: Returns the community matching the requested id
      operationId: findCommunity
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.FindCommunityByIdResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get Single community by id.
      tags:
      - Community
    put:
      consumes:
      - application/json
      description: Replaces the community's name, category and description. Only the
        owner may (403 otherwise).
      operationId: updateCommunity
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      - description: Community details
        in: body
        name: Community
        required: true
        schema:
          $ref: '#/definitions/transport.UpdateCommunityRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Updates a community.
      tags:
      - Community
  /communities/{communityId}/hot-topics:
    get:
      description: Returns a list of topics
      operationId: findCommunityHotTopics
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.TopicsResponse'
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Gets the 5 most recently replied topics of a community.
      tags:
      - Community

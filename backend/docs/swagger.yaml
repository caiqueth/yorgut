basePath: /api/v1
definitions:
  request.CreateCommunityMembershipRequest:
    properties:
      communityID:
        type: integer
      userID:
        type: integer
    type: object
  request.CreateCommunityRequest:
    properties:
      createdByID:
        type: integer
      description:
        type: string
      name:
        type: string
    type: object
  request.CreateUserRequest:
    properties:
      birthDate:
        type: string
      email:
        type: string
      name:
        type: string
    type: object
  response.FindCommunityByIdResponse:
    properties:
      createdBy:
        type: integer
      description:
        type: string
      name:
        type: string
    type: object
  response.FindManyCommunitiesResponse:
    type: object
  response.FindUserByIdResponse:
    properties:
      birthDate:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
    type: object
host: localhost:8080
info:
  contact: {}
  description: Our very own OG Social Media.
  title: Yorgut APIs
  version: "1.0"
paths:
  /community:
    get:
      description: Returns an array of communities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FindManyCommunitiesResponse'
      summary: Get Multiple communities.
      tags:
      - Community
    post:
      parameters:
      - description: Create Community
        in: body
        name: community
        required: true
        schema:
          $ref: '#/definitions/request.CreateCommunityRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.Response'
      summary: Create Community
      tags:
      - Community
    put:
      description: Updates properties of a single community
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.Response'
      summary: Updates a community.
      tags:
      - Community
  /community/{communityId}:
    delete:
      description: Deletes a community
      parameters:
      - description: delete community by id
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete community by id.
      tags:
      - Community
    get:
      description: Returns the community matching the requested id
      parameters:
      - description: get community by id
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FindCommunityByIdResponse'
      summary: Get Single community by id.
      tags:
      - Community
  /community_membership:
    post:
      parameters:
      - description: Create Community Membership
        in: body
        name: community
        required: true
        schema:
          $ref: '#/definitions/request.CreateCommunityMembershipRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.Response'
      summary: Create Community Membership
      tags:
      - CommunityMembership
  /community_membership/{userId}:
    get:
      parameters:
      - description: id of the user
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.Response'
      summary: Lists communities that a user is member of
      tags:
      - CommunityMembership
  /community_membership/{userId}/{communityId}:
    delete:
      parameters:
      - description: id of the user
        in: path
        name: userId
        required: true
        type: integer
      - description: id of the community
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete Community Membership
      tags:
      - CommunityMembership
  /user:
    get:
      description: Returns a list of users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Gets a list of users.
      tags:
      - User
    post:
      parameters:
      - description: Create User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/request.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Create user
      tags:
      - User
    put:
      description: Returns null
      parameters:
      - description: update user
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Update user
      tags:
      - User
  /user/{userId}:
    delete:
      description: Deletes the user matching the requested id
      parameters:
      - description: delete user by id
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete User by id
      tags:
      - User
    get:
      description: Returns the user matching the requested id
      parameters:
      - description: get user by id
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FindUserByIdResponse'
      summary: Get Single user by id.
      tags:
      - User
schemes:
- http
swagger: "2.0"

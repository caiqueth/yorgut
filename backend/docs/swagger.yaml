    post:
      parameters:
      - description: Create User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create user
      tags:
      - Users
  /users/{userId}:
    get:
      description: Returns the user matching the requested id
      parameters:

host: localhost:8080
info:
  contact: {}
  description: Our very own OG Social Media.
  title: Yorgut APIs
  version: "1.0"
paths:
  /community:
    get:
      description: Returns an array of communities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindManyCommunitiesResponse'
      summary: Get Multiple communities.
      tags:
      - Community
    post:
      parameters:
      - description: Community Name
        in: formData
        name: name
        required: true
        type: string
      - description: Community Description
        in: formData
        name: description
        required: true
        type: string
      - description: ID of Creator
        in: formData
        name: createdById
        required: true
        type: integer
      - description: Community Picture
        in: formData
        name: picture
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create Community
      tags:
      - Community
    put:
      description: Updates properties of a single community
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Updates a community.
      tags:
      - Community
  /community/{communityId}:
    delete:
      description: Deletes a community
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Delete community by id.
      tags:
      - Community
    get:
      description: Returns the community matching the requested id
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindCommunityByIdResponse'
      summary: Get Single community by id.
      tags:
      - Community
  /community/{communityId}/hot_topics:
    get:
      description: Returns a list of topics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TopicsResponse'
      summary: Gets a list of most recently replied topics.
      tags:
      - Community
  /community/{communityId}/members:
    get:
      description: Returns a list of the community members matching the requested
        id and a few stats
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindCommunityMembersResponse'
      summary: Get community members.
      tags:
      - Community
  /community/{communityId}/profile:
    get:
      description: Returns the community profile matching the requested id
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindCommunityProfileByIdResponse'
      summary: Get Single community profile by its id.
      tags:
      - Community
  /community/{communityId}/related:
    get:
      description: Returns an array of communities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindManyCommunitiesResponse'
      summary: Get Related communities.
      tags:
      - Community
  /community/profile:
    post:
      parameters:
      - description: Community Name
        in: formData
        name: communityId
        required: true
        type: string
      - description: Community Description
        in: formData
        name: description
        required: true
        type: string
      - description: Community Picture
        in: formData
        name: picture
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create Community Profile
      tags:
      - Community
  /community_membership:
    post:
      parameters:
      - description: Create Community Membership
        in: body
        name: community
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCommunityMembershipRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create Community Membership
      tags:
      - CommunityMembership
  /community_membership/{userId}/{communityId}:
    delete:
      parameters:
      - description: id of the user
        in: path
        name: userId
        required: true
        type: integer
      - description: id of the community
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Delete Community Membership
      tags:
      - CommunityMembership
  /friendship:
    post:
      description: Logged user makes a new friendship request.
      parameters:
      - description: Create Friendship
        in: body
        name: Friendship
        required: true
        schema:
          $ref: '#/definitions/dto.CreateFriendshipRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Creates a Friendship request.
      tags:
      - Friendship
  /friendship/{friendshipId}:
    delete:
      description: Deletes a Friendship.
      parameters:
      - description: delete Friendship by id
        in: path
        name: friendshipId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Deletes a Friendship by id.
      tags:
      - Friendship
  /friendship/friend/{userId}:
    delete:
      description: Logged user deletes a friendship.
      parameters:
      - description: Target User ID
        in: path
        name: friendId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Deletes a Friendship by the target userId Id.
      tags:
      - Friendship
  /friendship/reply:
    post:
      description: Repliess a Friendship request.
      parameters:
      - description: Accept Friendship
        in: body
        name: FriendshipRequest
        required: true
        schema:
          $ref: '#/definitions/dto.ReplyFriendshipRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Reply a Friendship request.
      tags:
      - Friendship
  /me:
    get:
      description: Returns the user matching the requested id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindUserResponse'
      summary: Get Single user by id.
      tags:
      - Me
    put:
      description: Returns null
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Update user
      tags:
      - Me
  /me/friends:
    get:
      description: Returns a list of friends
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindFriendsOfUserResponse'
      summary: Gets a list of friends of the user.
      tags:
      - Me
  /me/friends/{userId}:
    get:
      description: Returns true or false
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AmIFriendOfResponse'
      summary: Evaluates if the logged user is friend of specified user
      tags:
      - Me
  /me/friends/pending:
    get:
      description: Returns a list of users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindPendingFriendshipOfUserResponse'
      summary: Gets a list of friendship invites of the user.
      tags:
      - Me
  /me/join/{communityId}:
    post:
      description: Joins a community.
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      summary: User joins a community.
      tags:
      - Me
  /me/leave/{communityId}:
    post:
      description: Leaves a community.
      parameters:
      - description: Community ID
        in: path
        name: communityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      summary: User leaves a community.
      tags:
      - Me
  /me/memberships:
    get:
      description: Returns a list of communities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindUserMembershipsResponse'
      summary: Gets a list of communities that user is member of.
      tags:
      - Me
  /me/memberships/{communityId}:
    get:
      description: Returns true or false
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AmIMemberOfResponse'
      summary: Evaluates if the logged user is member of specified community
      tags:
      - Me
  /me/photoAlbums:
    get:
      description: Returns a list of photo albums
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindPhotoAlbumOfUserResponse'
      summary: Gets a list of photo albums of the user.
      tags:
      - Me
  /me/profile:
    get:
      description: Returns the user matching the token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindUserWithProfileByIdResponse'
      summary: Get logged user with it's profile by their Token.
      tags:
      - Me
  /photo:
    post:
      description: Creates a Photo.
      parameters:
      - description: Create Photo
        in: body
        name: Photo
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePhotoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create a Photo.
      tags:
      - Photo
  /photo/{photoId}:
    delete:
      description: Deletes a Photo.
      parameters:
      - description: delete Photo by id
        in: path
        name: photoId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Delete Photo by id.
      tags:
      - Photo
  /photoAlbum:
    get:
      description: Returns an array of PhotoAlbums.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Get a list of PhotoAlbums.
      tags:
      - PhotoAlbum
    post:
      description: Creates a PhotoAlbum.
      parameters:
      - description: Create PhotoAlbum
        in: body
        name: PhotoAlbum
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePhotoAlbumRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create a PhotoAlbum.
      tags:
      - PhotoAlbum
    put:
      description: Updates properties of a single PhotoAlbum
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Updates a PhotoAlbum.
      tags:
      - PhotoAlbum
  /photoAlbum/{photoAlbumId}:
    delete:
      description: Deletes a PhotoAlbum.
      parameters:
      - description: delete PhotoAlbum by id
        in: path
        name: photoAlbumId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Delete PhotoAlbum by id.
      tags:
      - PhotoAlbum
  /scrap:
    post:
      description: Creates a Scrap.
      parameters:
      - description: Create Scrap
        in: body
        name: Scrap
        required: true

      - Scrap
  /scrap/user/{userId}:
    get:
      description: Returns a list of scraps
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FindScrapOfUserRecipientResponse'
      summary: Gets a list of scraps of a user.
      tags:
      - Scrap
  /testimonial:
    post:
      description: Creates a Testimonial.
      parameters:
      - description: Create Testimonial
        in: body
        name: Testimonial
        required: true
        schema:
